<!DOCTYPE html>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&display=swap');

    ::-webkit-scrollbar {
        display: none;
    }
    
    * {
        margin: 0;
        padding: 0;
        font-family: "Open Sans";
        color: #E4E4EF;

    }

    .splash__accent-color {
        color: #F07B7B;
    }

    .splash__title {
        width: 36rem;
        display: block;
        margin: -0.5rem auto;
    }

    .splash__invoice-form {
        margin: auto;
        width: 23.5rem;
        height: 25rem;
    }

    .splash__label {
        font-weight: 600;
        font-size: 1rem;
    }

    .splash__input {
        display: inline-block;
            background: #201E45;
        text-align: left;
        width: 21rem;
        padding: 1rem 1rem;
        margin: 2.5rem 0;
        margin-top: 1rem;
        border: 2px solid #404267;
        border-radius: 5px;
        outline: none;
        transition: all ease-in-out 300ms;
    }

    .splash__input:focus {
        border: 2px solid #F07B7B;
    }

    .splash__input.amount {
        margin-bottom: 1rem;
            background: #201E45;
    }

    .splash__input.description {
        max-width: 21rem;
        background: #201E45;
        min-width: 21rem;
        min-height: 10rem;
        height: 10rem;
    }

    .splash__input.description::placeholder {
        color: #404267;
    }

    .splash__submit {
        padding: 1rem 8rem;
        color: #201E45;
        background: #F07B7B;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 5px;
        border: none;
        outline: none;
        cursor: pointer;
        transition: all ease-in-out 300ms;
        margin-bottom: 3rem;
    }

    .splash__submit:hover {
        color: #272553;
        background: #ff9898;
    }
</style>
